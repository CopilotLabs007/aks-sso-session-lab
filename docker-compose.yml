services:
  api:
    build:
      context: .
      dockerfile: backend/SsoSession.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Frontend__BaseUrl: http://localhost:8080
      DemoIdp__Username: ${DEMO_IDP_USERNAME:-}
      DemoIdp__Password: ${DEMO_IDP_PASSWORD:-}
    ports:
      - "127.0.0.1:5209:8080"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"