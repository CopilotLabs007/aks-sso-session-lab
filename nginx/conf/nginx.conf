# Local reverse proxy for the SSO Session Management Lab (Phase 1, no Docker).
# Run with the prefix set to this folder (see nginx.ps1) so every relative path below
# resolves inside ./nginx.

worker_processes  1;

error_log  logs/error.log  warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Logs the path without the query string: /auth-callback?code=...&state=... must never
    # write the authorization code to disk. Cookie and Set-Cookie headers are not logged either.
    log_format  no_query  '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent $request_time';
    access_log  logs/access.log  no_query;

    upstream sso_api {
        server     127.0.0.1:5208;
        keepalive  16;
    }

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        # Built Angular app (npx ng build, run in frontend/sso-session-ui).
        root   ../frontend/sso-session-ui/dist/sso-session-ui/browser;
        index  index.html;

        # Same-origin API: the browser sees one origin (localhost:8080), so the HttpOnly
        # session cookie is sent automatically and no CORS configuration is needed.
        location /api/ {
            proxy_pass          http://sso_api;
            proxy_http_version  1.1;
            proxy_set_header    Connection         "";
            proxy_set_header    Host               $http_host;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
            proxy_set_header    X-Forwarded-Host   $http_host;

            add_header Cache-Control           "no-store"     always;
            add_header X-Content-Type-Options  "nosniff"      always;
            add_header X-Frame-Options         "DENY"         always;
            add_header Referrer-Policy         "no-referrer"  always;
        }

        # Hashed build output can be cached; index.html must always be revalidated.
        location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
            try_files   $uri =404;
            expires     7d;
            add_header  X-Content-Type-Options  "nosniff"  always;
        }

        # Angular client-side routes (/simulated-idp-login, /auth-callback, /dashboard).
        # no-referrer keeps the one-time code in the callback URL out of Referer headers.
        location / {
            try_files   $uri $uri/ /index.html;
            add_header  Cache-Control           "no-cache"     always;
            add_header  X-Content-Type-Options  "nosniff"      always;
            add_header  X-Frame-Options         "DENY"         always;
            add_header  Referrer-Policy         "no-referrer"  always;
        }
    }
}
